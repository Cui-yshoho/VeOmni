model:
  model_path: Qwen/Qwen3.5-35B-A3B
  ops_implementation:
    attn_implementation: flash_attention_2
    rms_norm_implementation: torch_npu
    rotary_pos_emb_implementation: torch_npu
    cross_entropy_loss_implementation: chunk_loss
    gated_mlp_implementation: eager
    moe_implementation: fused_npu
    rms_norm_gated_implementation: torch_npu
    causal_conv1d_implementation: triton
    chunk_gated_delta_rule_implementation: fla_npu
    load_balancing_loss_implementation: eager
  optimizer:
    type: muon
    lr: 1.0e-5
    weight_decay: 0.1
    lr_decay_style: cosine
    max_grad_norm: 1.0
    muon_lr: 1.0e-5
    muon_momentum: 0.95
    muon_nesterov: true
    muon_weight_decay: 0.1
    muon_ns_steps: 5
    muon_ns_implementation: std
    muon_adjust_lr_fn: match_rms_adamw
    muon_expert_zero_comm: true
  accelerator:
    dp_shard_size: 64
    ulysses_size: 1
    ep_size: 1
    fsdp_config:
      fsdp_mode: fsdp2
    gradient_checkpointing:
      enable_reentrant: false
    init_device: meta
  chat_template: qwen3vl
  processor_config:
    size:
      shortest_edge: 4096
      longest_edge: 81920

data:
  train_path: path/to/qwen35_35b_a3b_8k_native_balanced
  data_type: conversation
  source_name: qwen_omni_offline_av
  max_seq_len: 8192
  train_size: 26214400
  mm_configs:
    image_min_pixels: 4096
    image_max_pixels: 4096
    video_min_pixels: 4096
    video_max_pixels: 4096
    min_frames: 20
    max_frames: 20
    frame_factor: 2
    use_audio_in_video: false
  dataloader:
    num_workers: 0

train:
  wandb:
    enable: false
    project: VeOmni
    name: qwen35_8k_benchmark-torch_fsdp2_muon_64die_8k
  freeze_vit: false
  num_train_epochs: 1
  dyn_bsz: false
  pad_to_length: false
  micro_batch_size: 1
  global_batch_size: 64
  max_steps: 50
  profile:
    enable: true
    start_step: 20
    end_step: 22
    warmup_steps: 3
    level: 0
    data_simplification: true
    trace_dir: outputs/torch_fsdp2_muon_64die_8k/profiling
    record_shapes: false
    profile_memory: false
    with_stack: false
    with_modules: false
    rank0_only: true
  checkpoint:
    output_dir: outputs/torch_fsdp2_muon_64die_8k
    manager: dcp
    save_epochs: 0
    save_hf_weights: false
