# Set model.model_path and data.train_path to your local checkpoint and dataset.
# Select fsdp_backend: torch | hyper; use_hyper_optimizer applies to Muon only.
# Profiling is disabled by default; enable train.profile for a separate run.
model:
  model_path: REPLACE_WITH_MODEL_PATH
  chat_template: qwen3vl
  broadcast_model_weights_from_rank0: true
  ep_sharded_stream_load: false
  ops_implementation:
    attn_implementation: flash_attention_2
    moe_implementation: fused_triton
    rms_norm_implementation: liger_kernel
    rotary_pos_emb_implementation: liger_kernel
    cross_entropy_loss_implementation: liger_kernel
    swiglu_mlp_implementation: eager
    load_balancing_loss_implementation: eager
  accelerator:
    init_device: meta
    dp_replicate_size: 1
    dp_shard_size: 16
    ulysses_size: 1
    ep_size: 1
    cp_size: 1
    tp_size: 1
    pp_size: 1
    enable_async: false
    gradient_checkpointing:
      enable: true
      enable_reentrant: false
      early_stop: true
    torch_compile:
      enable: false
    offload_config:
      enable_activation: false
      enable_async_activation: false
    fsdp_config:
      fsdp_mode: fsdp2
      fsdp_backend: torch
      reshard_after_forward: true
      reshard_after_backward: true
      forward_prefetch: true
      offload: false
      low_precision_reduce_scatter_comm: false
      mixed_precision:
        enable: true
        param_dtype: bfloat16
        reduce_dtype: bfloat16
        cast_forward_inputs: true
  optimizer:
    type: adamw
    use_hyper_optimizer: false
    lr: 1.0e-5
    lr_min: 1.0e-7
    lr_start: 0.0
    lr_warmup_ratio: 0.0
    lr_decay_style: cosine
    lr_decay_ratio: 1.0
    betas: [0.9, 0.95]
    weight_decay: 0.0
    max_grad_norm: 1.0
    muon_ns_implementation: std
    muon_adjust_lr_fn: match_rms_adamw
    muon_ns_steps: 5
    muon_ns_coefficients: [3.4445, -4.775, 2.0315]
    muon_eps: 1.0e-7
    muon_momentum: 0.95
    muon_nesterov: true
    muon_weight_decay: 0.0
    muon_expert_zero_comm: false
    muon_head_group_size: 0
    muon_head_split_modules: []
data:
  train_path: REPLACE_WITH_DATA_PATH
  data_type: conversation
  datasets_type: mapping
  text_keys: messages
  source_name: sharegpt4v_sft
  mm_configs: {}
  max_seq_len: 2048
  train_size: 10000000
  train_sample: 100000
  dyn_bsz_buffer_size: 200
  silent_exception: false
  dataloader:
    type: native
    num_workers: 2
    pin_memory: true
    persistent_workers: false
    prefetch_factor: 2
    in_order: true
    drop_last: true
    use_background_prefetcher: false
train:
  freeze_vit: false
  freeze_audio_tower: false
  vit_lr: 1.0e-6
  global_batch_size: 16
  micro_batch_size: 1
  num_train_epochs: 1
  max_steps: 100
  dyn_bsz: true
  dyn_bsz_runtime: main
  dyn_bsz_count_mode: total
  pad_to_length: false
  bsz_warmup_ratio: 0.0
  seed: 42
  enable_full_determinism: false
  sync_each_train_step: false
  empty_cache_steps: 500
  gc_steps: 500
  eval_steps: 0
  eval_epochs: 0
  checkpoint:
    output_dir: outputs/hyperparallel/qwen3vl_adamw_2k_16
    manager: dcp
    load_path: null
    save_steps: 0
    save_epochs: 0
    hf_save_steps: 0
    hf_save_epochs: 0
    save_hf_weights: false
    save_async: false
    dcp_save_to_lowest_rank: false
  profile:
    enable: false
  wandb:
    enable: false
